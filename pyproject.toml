[project]
name = "agentos"
version = "0.1.0"
description = "Resident desktop AI agent kernel"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "playwright>=1.40",
    "mss>=9.0",
    "pillow>=10.0",
    "pywinauto>=0.6.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["kernel*", "brain*", "memory*", "tools*", "evals*"]
