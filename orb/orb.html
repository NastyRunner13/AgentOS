<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Friday</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    #wrap { position: absolute; inset: 6%; border-radius: 50%; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    #menu {
      display: none; position: fixed; z-index: 2; min-width: 140px;
      background: #1c1e22; color: #eee; font: 13px/1.4 system-ui, sans-serif;
      border: 1px solid #333; border-radius: 8px; padding: 4px;
    }
    #menu button {
      display: block; width: 100%; text-align: left; background: none; border: 0;
      color: inherit; padding: 8px 10px; border-radius: 6px; cursor: pointer;
    }
    #menu button:hover { background: #2a2e36; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="wrap"></div>
  <div id="menu">
    <button data-act="mute">Mute mic</button>
    <button data-act="sleep">Sleep</button>
    <button data-act="close">Close orb</button>
  </div>
  <script type="module">
    // ElevenLabs UI Orb — https://ui.elevenlabs.io/docs/components/orb
    // https://github.com/elevenlabs/ui/blob/main/apps/www/registry/elevenlabs-ui/ui/orb.tsx (MIT)
    import * as THREE from "three"

    const wrap = document.getElementById("wrap")
    const menu = document.getElementById("menu")
    const state = {
      agentState: null,
      inputVolume: 0,
      outputVolume: 0.3,
      colors: ["#CADCFC", "#A0B9D1"],
      muted: false,
    }

    window.setOrb = (next) => {
      if (!next || typeof next !== "object") return
      if ("agentState" in next) state.agentState = next.agentState
      if ("inputVolume" in next) state.inputVolume = clamp01(next.inputVolume)
      if ("outputVolume" in next) state.outputVolume = clamp01(next.outputVolume)
      if (Array.isArray(next.colors) && next.colors.length >= 2) {
        state.colors = [next.colors[0], next.colors[1]]
        target1.set(next.colors[0])
        target2.set(next.colors[1])
      }
      if ("muted" in next) {
        state.muted = !!next.muted
        const btn = menu.querySelector("[data-act=mute]")
        if (btn) btn.textContent = state.muted ? "Unmute mic" : "Mute mic"
      }
    }

    function clamp01(n) {
      n = Number(n)
      if (!Number.isFinite(n)) return 0
      return Math.min(1, Math.max(0, n))
    }

    function splitmix32(a) {
      return function () {
        a |= 0
        a = (a + 0x9e3779b9) | 0
        let t = a ^ (a >>> 16)
        t = Math.imul(t, 0x21f0aaad)
        t = t ^ (t >>> 15)
        t = Math.imul(t, 0x735a2d97)
        return ((t = t ^ (t >>> 15)) >>> 0) / 4294967296
      }
    }

    const random = splitmix32(1000)
    const offsets = new Float32Array(Array.from({ length: 7 }, () => random() * Math.PI * 2))
    const target1 = new THREE.Color("#CADCFC")
    const target2 = new THREE.Color("#A0B9D1")

    const scene = new THREE.Scene()
    const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 100)
    camera.position.z = 5
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, premultipliedAlpha: true })
    renderer.setClearColor(0x000000, 0)
    wrap.appendChild(renderer.domElement)

    function resize() {
      const w = wrap.clientWidth || 140
      const h = wrap.clientHeight || 140
      renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1))
      renderer.setSize(w, h, false)
      camera.aspect = w / h
      camera.updateProjectionMatrix()
    }
    new ResizeObserver(resize).observe(wrap)
    resize()

    const uniforms = {
      uColor1: { value: new THREE.Color("#CADCFC") },
      uColor2: { value: new THREE.Color("#A0B9D1") },
      uOffsets: { value: offsets },
      uPerlinTexture: { value: makeNoise() },
      uTime: { value: 0 },
      uAnimation: { value: 0.1 },
      uInverted: { value: 0 },
      uInputVolume: { value: 0 },
      uOutputVolume: { value: 0.3 },
      uOpacity: { value: 0 },
    }

    const mat = new THREE.ShaderMaterial({
      uniforms,
      transparent: true,
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: fragmentShader(),
    })
    const mesh = new THREE.Mesh(new THREE.CircleGeometry(3.5, 64), mat)
    scene.add(mesh)

    let curIn = 0, curOut = 0.3, animSpeed = 0.1
    const clock = new THREE.Clock()
    function tick() {
      requestAnimationFrame(tick)
      const dt = clock.getDelta()
      const u = uniforms
      u.uTime.value += dt * 0.5
      if (u.uOpacity.value < 1) u.uOpacity.value = Math.min(1, u.uOpacity.value + dt * 2)
      const t = u.uTime.value * 2
      let targetIn = 0, targetOut = 0.3
      const agent = state.agentState
      if (agent === null || agent === undefined) {
        targetIn = 0
        targetOut = 0.3
      } else if (agent === "listening") {
        targetIn = clamp01(Math.max(0.55 + Math.sin(t * 3.2) * 0.35, state.inputVolume))
        targetOut = 0.45
      } else if (agent === "talking") {
        targetIn = clamp01(0.65 + Math.sin(t * 4.8) * 0.22)
        targetOut = clamp01(Math.max(0.75 + Math.sin(t * 3.6) * 0.22, state.outputVolume))
      } else if (agent === "thinking") {
        const base = 0.38 + 0.07 * Math.sin(t * 0.7)
        const wander = 0.05 * Math.sin(t * 2.1) * Math.sin(t * 0.37 + 1.2)
        targetIn = clamp01(base + wander)
        targetOut = clamp01(0.48 + 0.12 * Math.sin(t * 1.05 + 0.6))
      }
      curIn += (targetIn - curIn) * 0.2
      curOut += (targetOut - curOut) * 0.2
      const targetSpeed = 0.1 + (1 - Math.pow(curOut - 1, 2)) * 0.9
      animSpeed += (targetSpeed - animSpeed) * 0.12
      u.uAnimation.value += dt * animSpeed
      u.uInputVolume.value = curIn
      u.uOutputVolume.value = curOut
      u.uColor1.value.lerp(target1, 0.08)
      u.uColor2.value.lerp(target2, 0.08)
      renderer.render(scene, camera)
    }
    tick()

    function makeNoise() {
      const n = 256
      const data = new Uint8Array(n * n)
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 255) | 0
      const tex = new THREE.DataTexture(data, n, n, THREE.RedFormat)
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping
      tex.needsUpdate = true
      const loader = new THREE.TextureLoader()
      loader.setCrossOrigin("anonymous")
      loader.load(
        "https://storage.googleapis.com/eleven-public-cdn/images/perlin-noise.png",
        (img) => {
          img.wrapS = img.wrapT = THREE.RepeatWrapping
          uniforms.uPerlinTexture.value = img
        },
        undefined,
        () => {}
      )
      return tex
    }

    function fragmentShader() {
      return `
        uniform float uTime;
        uniform float uAnimation;
        uniform float uInverted;
        uniform float uOffsets[7];
        uniform vec3 uColor1;
        uniform vec3 uColor2;
        uniform float uInputVolume;
        uniform float uOutputVolume;
        uniform float uOpacity;
        uniform sampler2D uPerlinTexture;
        varying vec2 vUv;
        const float PI = 3.14159265358979323846;
        bool drawOval(vec2 polarUv, vec2 polarCenter, float a, float b, bool reverseGradient, float softness, out vec4 color) {
            vec2 p = polarUv - polarCenter;
            float oval = (p.x * p.x) / (a * a) + (p.y * p.y) / (b * b);
            float edge = smoothstep(1.0, 1.0 - softness, oval);
            if (edge > 0.0) {
                float gradient = reverseGradient ? (1.0 - (p.x / a + 1.0) / 2.0) : ((p.x / a + 1.0) / 2.0);
                gradient = mix(0.5, gradient, 0.1);
                color = vec4(vec3(gradient), 0.85 * edge);
                return true;
            }
            return false;
        }
        vec3 colorRamp(float grayscale, vec3 color1, vec3 color2, vec3 color3, vec3 color4) {
            if (grayscale < 0.33) return mix(color1, color2, grayscale * 3.0);
            else if (grayscale < 0.66) return mix(color2, color3, (grayscale - 0.33) * 3.0);
            else return mix(color3, color4, (grayscale - 0.66) * 3.0);
        }
        vec2 hash2(vec2 p) {
            return fract(sin(vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)))) * 43758.5453);
        }
        float noise2D(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            float n = mix(
                mix(dot(hash2(i + vec2(0.0, 0.0)), f - vec2(0.0, 0.0)),
                    dot(hash2(i + vec2(1.0, 0.0)), f - vec2(1.0, 0.0)), u.x),
                mix(dot(hash2(i + vec2(0.0, 1.0)), f - vec2(0.0, 1.0)),
                    dot(hash2(i + vec2(1.0, 1.0)), f - vec2(1.0, 1.0)), u.x),
                u.y);
            return 0.5 + 0.5 * n;
        }
        float sharpRing(vec3 decomposed, float time) {
            float noise = mix(noise2D(vec2(decomposed.x, time) * 5.0), noise2D(vec2(decomposed.y, time) * 5.0), decomposed.z);
            noise = (noise - 0.5) * 2.5;
            return 1.0 + noise * 0.3 * 1.5;
        }
        float smoothRing(vec3 decomposed, float time) {
            float noise = mix(noise2D(vec2(decomposed.x, time) * 6.0), noise2D(vec2(decomposed.y, time) * 6.0), decomposed.z);
            noise = (noise - 0.5) * 5.0;
            return 0.9 + noise * 0.2;
        }
        float flow(vec3 decomposed, float time) {
            return mix(texture2D(uPerlinTexture, vec2(time, decomposed.x / 2.0)).r,
                       texture2D(uPerlinTexture, vec2(time, decomposed.y / 2.0)).r, decomposed.z);
        }
        void main() {
            vec2 uv = vUv * 2.0 - 1.0;
            float radius = length(uv);
            float theta = atan(uv.y, uv.x);
            if (theta < 0.0) theta += 2.0 * PI;
            vec3 decomposed = vec3(theta / (2.0 * PI), mod(theta / (2.0 * PI) + 0.5, 1.0) + 1.0, abs(theta / PI - 1.0));
            float noise = flow(decomposed, radius * 0.03 - uAnimation * 0.2) - 0.5;
            theta += noise * mix(0.08, 0.25, uOutputVolume);
            vec4 color = vec4(1.0);
            float originalCenters[7] = float[7](0.0, 0.5 * PI, 1.0 * PI, 1.5 * PI, 2.0 * PI, 2.5 * PI, 3.0 * PI);
            float centers[7];
            for (int i = 0; i < 7; i++) centers[i] = originalCenters[i] + 0.5 * sin(uTime / 20.0 + uOffsets[i]);
            vec4 ovalColor;
            for (int i = 0; i < 7; i++) {
                float n = texture2D(uPerlinTexture, vec2(mod(centers[i] + uTime * 0.05, 1.0), 0.5)).r;
                float a = 0.5 + n * 0.3;
                float b = n * mix(3.5, 2.5, uInputVolume);
                bool reverseGradient = (i % 2 == 1);
                float distTheta = min(abs(theta - centers[i]), min(abs(theta + 2.0 * PI - centers[i]), abs(theta - 2.0 * PI - centers[i])));
                if (drawOval(vec2(distTheta, radius), vec2(0.0, 0.0), a, b, reverseGradient, 0.6, ovalColor)) {
                    color.rgb = mix(color.rgb, ovalColor.rgb, ovalColor.a);
                    color.a = max(color.a, ovalColor.a);
                }
            }
            float ringRadius1 = sharpRing(decomposed, uTime * 0.1);
            float ringRadius2 = smoothRing(decomposed, uTime * 0.1);
            float inputRadius1 = radius + uInputVolume * 0.2;
            float inputRadius2 = radius + uInputVolume * 0.15;
            float opacity1 = mix(0.2, 0.6, uInputVolume);
            float opacity2 = mix(0.15, 0.45, uInputVolume);
            float ringAlpha1 = (inputRadius2 >= ringRadius1) ? opacity1 : 0.0;
            float ringAlpha2 = smoothstep(ringRadius2 - 0.05, ringRadius2 + 0.05, inputRadius1) * opacity2;
            float totalRingAlpha = max(ringAlpha1, ringAlpha2);
            color.rgb = 1.0 - (1.0 - color.rgb) * (1.0 - vec3(1.0) * totalRingAlpha);
            float luminance = mix(color.r, 1.0 - color.r, uInverted);
            color.rgb = colorRamp(luminance, vec3(0.0), uColor1, uColor2, vec3(1.0));
            color.a *= uOpacity;
            gl_FragColor = color;
        }
      `
    }

    function bridge(name, ...args) {
      const api = window.pywebview && window.pywebview.api
      if (api && typeof api[name] === "function") return api[name](...args)
    }

    let press = null
    wrap.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return
      menu.style.display = "none"
      press = { x: e.screenX, y: e.screenY, dragged: false }
    })
    window.addEventListener("pointermove", (e) => {
      if (!press) return
      const dx = e.screenX - press.x, dy = e.screenY - press.y
      if (Math.abs(dx) + Math.abs(dy) > 8) {
        press.dragged = true
        press.x = e.screenX
        press.y = e.screenY
        bridge("drag", e.screenX, e.screenY, dx, dy)
      }
    })
    window.addEventListener("pointerup", (e) => {
      if (!press) return
      if (!press.dragged && e.button === 0) bridge("toggle")
      press = null
    })
    wrap.addEventListener("contextmenu", (e) => {
      e.preventDefault()
      menu.style.left = e.clientX + "px"
      menu.style.top = e.clientY + "px"
      menu.style.display = "block"
    })
    menu.addEventListener("click", (e) => {
      const act = e.target && e.target.dataset && e.target.dataset.act
      menu.style.display = "none"
      if (act) bridge(act)
    })
    document.addEventListener("click", () => { menu.style.display = "none" })
  </script>
</body>
</html>
